# הגדרות ריצה שבועית – ניתוח גבייה (Hyp + לוח הגבייה). ללא נתוני לקוחות.
columns: {}
doc_types: {}
alerts:
  min_debt: 1
  urgent_amount: 10000          # חוב חריג: נטו לגבייה מעל סכום זה => דחוף
  urgent_min_amount: 5000       # דחוף לפי ותק (90+ ימים) רק מעל סכום זה
  urgent_days: 90
  followup_days: 30
  auto_charge_grace_days: 45
  recent_payment_days: 60
  no_payment_days: 120
  formula_gap_tolerance: 100
# חשבונית מס שפתוחה ב-Hyp: false = לא חוב לגבייה (מופקת עם קבלת התשלום) אלא פריט לאימות; true = נספרת כחוב
tax_invoice_open_is_debt: false
# שכ"ט שהופק בחשבון עסקה אך טרם מגיע (נקרא מהמסמכים עצמם):
#   דו"ח שנתי / מאזן / ביקורת לשנת מס מ-not_due_from_year ואילך אינם חוב עד שיש תיעוד שהדוח הוגש
#   (רשימת "שידור דוחות" בלוח, או תיקון שהושאר לסוכן בלוח). שנת מס שטרם הסתיימה – תמיד טרם מגיע.
not_due_from_year: 2025
# שיטת העבודה: חשבון עסקה אחד (או שניים) לכל השנה, ובכל תשלום מופקת חשבונית מס / חשבונית מס קבלה נפרדת.
# לכן: חוב = החלק היחסי של חשבון העסקה שהגיע (סכום / 12 × חודשים שעברו) − מה ששולם. דוח שנתי ומאזן אינם מחולקים.
prorate_future_periods: true
auto_charge_accrue_current_month: false   # בחיוב קבוע החודש השוטף נספר רק אחרי שהסתיים
# מחזור פנייה חוזרת (ימים) כשלא נקבע מועד בלוח
contact_cadence_days: {דחוף: 7, לטיפול: 14, מעקב: 30}
weekly_capacity: 60             # מספר פניות בשבוע למנהלת הגבייה
holidays: []                    # תאריכים (YYYY-MM-DD) שאינם ימי עבודה
# מוחרגים מרשימת הפנייה (מזהה לקוח ב-Hyp) – לפי החלטת הנהלה
exclude_hyp_ids:
  - 2459006                     # צד קשור
