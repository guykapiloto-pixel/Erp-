# הגדרות סוכן בדיקת חובות לקוחות – לוח "יעל EK-גבייה"
# יש להעתיק ל-config.yaml ולהשלים את הערכים המסומנים ב-TODO לאחר בדיקת מבנה הלוח.

source:
  # monday = שליפה ישירה ב-API (דורש MONDAY_API_TOKEN במשתני הסביבה)
  # file   = קובץ ייצוא של הלוח (Excel/CSV) מ-monday: "..." > Export board to Excel
  type: monday
  board_id: "TODO"            # מספר הלוח מתוך ה-URL: monday.com/boards/<board_id>
  page_size: 500              # מקסימום של monday ל-items_page

# מבנה הלוח:
#   documents = כל שורה היא מסמך (חשבון עסקה / חשבונית מס / חשבונית מס קבלה / זיכוי)
#   summary   = כל שורה היא לקוח, ובעמודות נפרדות הסכומים המצטברים לכל סוג מסמך
layout: documents

# מיפוי עמודות לפי כותרת העמודה בלוח (בדיוק כפי שמופיעה), או לפי column id של monday.
# "item_name" = עמודת שם הפריט (העמודה הראשונה בלוח).
columns:
  customer: item_name          # TODO: שם לקוח / מספר לקוח
  customer_id: null            # מומלץ: ח.פ./מספר לקוח, אם קיים. משמש כמפתח במקום השם
  doc_type: "סוג מסמך"          # TODO
  amount: "סכום"                # TODO: סכום כולל מע"מ (ראו הערה בתיעוד)
  date: "תאריך"                 # TODO
  doc_number: "מספר מסמך"       # TODO
  status: null                  # עמודת סטטוס (למשל "מבוטל"), אם קיימת
  contact: null                 # טלפון / מייל / איש קשר – יוצג בדוח הפנייה

# layout: summary בלבד – עמודות הסכומים לכל סוג
summary_columns:
  transaction: "חשבונות עסקה"
  tax_invoice: "חשבוניות מס"
  tax_invoice_receipt: "חשבוניות מס קבלה"
  credit: "זיכויים"

# מיפוי ערכי "סוג מסמך" לקטגוריות החישוב. ההשוואה מתעלמת מרווחים, גרשיים ומקפים.
doc_types:
  transaction: ["חשבון עסקה", "חשבונית עסקה", "עסקה", "דרישת תשלום", "proforma"]
  tax_invoice: ["חשבונית מס", "חשבונית"]
  tax_invoice_receipt: ["חשבונית מס קבלה", "חשבונית מס/קבלה", "חשבונית מס-קבלה", "חמ\"ק"]
  credit: ["חשבונית זיכוי", "זיכוי", "חשבונית מס זיכוי"]
  # סוגים שמוצאים מהחישוב במכוון ומדווחים כהערה בלבד
  ignored: ["קבלה", "הצעת מחיר", "תעודת משלוח"]

# ערכי סטטוס שמוציאים מסמך מהחישוב
cancelled_statuses: ["מבוטל", "בוטל", "cancelled", "canceled"]

# סימן הזיכוי: abs = הסכום נלקח בערכו המוחלט ומתווסף לחוב (לפי ההגדרה: "בתוספת זיכויים")
#              as_is = הסכום נלקח כפי שהוא רשום (אם בלוח זיכוי רשום במינוס ויש לנכות אותו)
credit_sign: abs

# ספי התראה
alerts:
  min_debt: 1                  # חוב מתחת לסכום זה (₪) נחשב מאופס (הפרשי אגורות/עיגול)
  urgent_amount: 20000         # חוב מעל סכום זה => דחוף
  urgent_days: 90              # חשבון עסקה פתוח ותיק מ-X ימים => דחוף
  followup_days: 30            # חשבון עסקה פתוח ותיק מ-X ימים => לטיפול
  negative_balance: -1         # יתרה שלילית מתחת לסכום זה => התראת יתר-זיכוי/חוסר חשבון עסקה
  similar_name_ratio: 0.80
  # מסלול hyp
  urgent_min_amount: 5000      # דחוף לפי ותק רק מעל סכום זה
  auto_charge_grace_days: 45   # לקוח בחיוב אוטומטי עם מסמך צעיר מזה – ללא פעולה
  recent_payment_days: 60      # שילם בתקופה זו => "משלם שוטף" (בירור פנימי ולא פנייה דחופה)
  no_payment_days: 120         # התראה על היעדר תשלום
  formula_gap_tolerance: 100   # פער מותר בין הנוסחה לחוב ב-Hyp

# מסלול hyp: לקוחות שמוחרגים מרשימת הפנייה (מזהה לקוח ב-Hyp), למשל צד קשור
exclude_hyp_ids: []     # סף דמיון לזיהוי לקוח שרשום בשני שמות
