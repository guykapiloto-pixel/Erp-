  base_credit_points_resident: {value: 2.25, status: verified, source: "Ordinance s.34, s.36"}
  extra_credit_points_female:  {value: 0.5,  status: secondary, source: "Ordinance s.36A"}
  surtax_threshold:      {value: 721560, status: verified, source: "Ordinance s.121B; frozen 2025-2027"}
  surtax_rate:           {value: 3, status: verified, source: "Ordinance s.121B(a)"}
  surtax_capital_extra_rate: {value: 2, status: verified, source: "Ordinance s.121B(a1)"}
  dividend_rate:          {value: 25, status: verified, source: "Ordinance s.125B(1)"}
