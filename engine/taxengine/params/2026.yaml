    source: "LAW-3511 ch.C s.5 (Amendment 288), effective 1.1.2026; BKL-2026"
    value:
      - {upper: 84120, rate: 10}
      - {upper: 120720, rate: 14}
      - {upper: 228000, rate: 20}
      - {upper: 301200, rate: 31}
      - {upper: 560280, rate: 35}
      - {upper: null, rate: 47}
